name: Crear APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Maquina-apk
          path: Maquina.apk
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" Maquina.apk --title "Máquina v${{ github.run_number }}" --notes "APK de prueba (firma de depuración)."
